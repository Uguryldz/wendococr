volumes:
  # KVKK: RAM-backed paylasimli volume — API+worker ayni dosyayi gorur (Redis modu),
  # veri diske degil RAM'e yazilir, stack inince buharlasir.
  ocr_uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,mode=0700,uid=10001,gid=10001"
  redis_data:

services:
  redis:
    image: redis:7-alpine
    container_name: wendococr-redis
    restart: unless-stopped
    # Parola OPSIYONEL: .env'de REDIS_PASSWORD tanimliysa --requirepass ile korur,
    # bos ise parolasiz calisir (deploy'u kirmaz). pickle RCE (K1) zaten kodda kapali.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - >
        redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wendococr_net

  wendococr:
    build:
      context: .
      dockerfile: Dockerfile
    image: uguryldz/wendococr:v1.0.6
    container_name: wendococr
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8099:8099"
    environment:
      UPLOAD_DIR: /tmp/wendococr
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      OCR_QUEUE_MAX_SIZE: "100"
      OCR_QUEUE_TIMEOUT: "300"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      FLAGS_use_mkldnn: "0"
      OCR_DPI_PADDLEOCR_LOW: "150"
      PADDLEOCR_LOW_MAX_SIDE: "1200"
      PADDLEOCR_LOW_TEXT_DET_LIMIT: "1200"
      PADDLEOCR_LOW_TEXT_DET_LIMIT_TYPE: "min"
    volumes:
      - ocr_uploads:/tmp/wendococr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wendococr_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  wendococr-worker:
    image: uguryldz/wendococr:v1.0.6
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["bash", "/app/entrypoint.sh", "worker"]
    # Worker API sunmaz; imajdaki HTTP healthcheck'i miras alırsa hep "unhealthy"
    # görünür. Canlılık zaten Redis heartbeat ile /health üzerinden izleniyor.
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
    environment:
      UPLOAD_DIR: /tmp/wendococr
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      OCR_MAX_WORKERS: "3"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      FLAGS_use_mkldnn: "0"
      OCR_DPI_PADDLEOCR_LOW: "150"
      PADDLEOCR_LOW_MAX_SIDE: "1200"
      PADDLEOCR_LOW_TEXT_DET_LIMIT: "1200"
      PADDLEOCR_LOW_TEXT_DET_LIMIT_TYPE: "min"
    volumes:
      - ocr_uploads:/tmp/wendococr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - wendococr_net
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

networks:
  wendococr_net:
    driver: bridge
