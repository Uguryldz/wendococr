# ═══════════════════════════════════════════════════════════════════════════
# wendococr — 2. (ve sonraki) MAKİNE için SADECE WORKER stack'i
#
# Mimari (2+ makine):
#   MAKİNE 1 : redis + API + N worker      (docker-compose.scale20.yml veya docker-compose.yml)
#   MAKİNE 2 : sadece worker'lar           (BU DOSYA) → Makine-1'deki Redis'e bağlanır
#
# Bu neden mümkün: JOB_FILE_INLINE=1 (varsayılan). API dosyayı base64 ile Redis
# payload'ına gömer; worker kendi tmpfs'ine yazıp işler, sonra siler. Paylaşımlı
# volume GEREKMEZ, worker herhangi bir makinede olabilir. KVKK: veri yalnız RAM/Redis.
#
# Makine-1'de Redis'i ağa aç (ports: "6379:6379") ve MUTLAKA parola koy
# (requirepass); bu dosyada REDIS_URL'e parolayı yaz. Redis'i internete AÇMA —
# sadece makineler arası özel ağ / firewall.
#
# Çalıştır (Makine 2):
#   export REDIS_URL='redis://:PAROLA@<makine1-ip>:6379/1'
#   docker compose -f docker-compose.worker-node.yml up -d
#   docker compose -f docker-compose.worker-node.yml up -d --scale wendococr-worker=8
#
# Worker sayısı = bu makinenin CPU'su ÷ 2 (her worker ~2 CPU + ~1 GB RAM).
# Toplam eş zamanlılık = tüm makinelerdeki worker toplamı (örn. 8 CPU+8 CPU → 4+4 = 8).
# ═══════════════════════════════════════════════════════════════════════════
services:
  wendococr-worker:
    image: uguryldz/wendococr:v1.1.3
    restart: unless-stopped
    command: ["bash", "entrypoint.sh", "worker"]
    environment:
      # ZORUNLU: Makine-1'deki Redis. Parola dahil.
      REDIS_URL: "${REDIS_URL:?REDIS_URL zorunlu - ornek redis PAROLA@makine1-ip 6379/1}"
      UPLOAD_DIR: /tmp/wendococr
      JOB_FILE_INLINE: "1"
      OCR_MAX_WORKERS: "1"
    # Yerel tmpfs: payload'dan gelen dosya buraya yazılır, iş bitince silinir (KVKK).
    # Paylaşımlı değil — bu makineye özel, RAM'de.
    tmpfs:
      - /tmp/wendococr:size=1g,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
