services:
  wendococr:
    build:
      context: .
      dockerfile: Dockerfile
    image: uguryldz/wendococr:v1.1.3
    container_name: wendococr
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      UPLOAD_DIR: /tmp/wendococr
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      OCR_QUEUE_MAX_SIZE: "100"
      # 300sn: WenDoc istemci zaman asimi (Ayarlar > Isleme > OCR zaman asimi) ile HIZALI.
      # 120 iken toplu kosuda kuyruktaki isler istemciden ONCE sunucuda 504'e dusuyordu
      # (prod olay 2026-08-24: 58x istemci AbortError + sunucu 504'leri).
      OCR_QUEUE_TIMEOUT: "300"
    # KVKK: gelen belgeler RAM-backed PAYLASIMLI volume'de islenir (diske yazilmaz).
    # tmpfs degil cunku Redis modunda API ve worker AYRI container — dosyayi
    # paylasmalari gerek. tmpfs container-ozel olur, worker dosyayi goremez.
    volumes:
      - ocr_uploads:/tmp/wendococr
    # GUVENLIK: privilege yukseltme yok + tum Linux capability'leri dusur.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - uinfra
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G

  wendococr-worker:
    image: uguryldz/wendococr:v1.1.3
    restart: unless-stopped
    command: ["bash", "entrypoint.sh", "worker"]
    environment:
      UPLOAD_DIR: /tmp/wendococr
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      OCR_MAX_WORKERS: "3"
    # KVKK: worker ayni RAM-backed paylasimli volume'u kullanir.
    volumes:
      - ocr_uploads:/tmp/wendococr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
    networks:
      - uinfra
    deploy:
      # 5 replica: toplu kosu kapasitesi (olay analizi: 3 seri worker 7-40sn/is ile
      # partiye yetismiyordu). Her replica max 2 CPU — sunucu cekirdegine gore ayarlayin.
      replicas: 5
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

networks:
  uinfra:
    external: true

volumes:
  # RAM-backed paylasimli volume: API ve worker ayni dosyayi gorur (Redis modu),
  # ama veri diske degil RAM'e yazilir (KVKK). Container/stack inince buharlasir.
  ocr_uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=512m,mode=0700,uid=10001,gid=10001"
